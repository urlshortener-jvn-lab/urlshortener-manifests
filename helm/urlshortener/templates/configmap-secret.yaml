apiVersion: v1
kind: ConfigMap
metadata:
  name: urlshortener-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.global.environment | quote }}
  ASPNETCORE_HTTP_PORTS: {{ .Values.backend.service.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  ConnectionStrings__Redis: {{ printf "redis-service:%v,abortConnect=false,connectTimeout=%v,syncTimeout=%v,asyncTimeout=%v" .Values.redis.service.port .Values.redis.timeoutMs .Values.redis.timeoutMs .Values.redis.timeoutMs | quote }}
  API_UPSTREAM_URL: {{ printf "http://backend-service.%s.svc.cluster.local:%v" .Release.Namespace .Values.backend.service.port | quote }}
  {{- if .Values.aspireDashboard.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://aspire-dashboard-service:%v" .Values.aspireDashboard.service.otlpPort | quote }}
  OTEL_SERVICE_NAME: "urlshortener-api"
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
data:
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $request_method $limit_post_key {
        default "";
        POST    $binary_remote_addr;
    }

    limit_req_zone $limit_post_key zone=shorten_limit:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            limit_req zone=shorten_limit burst=29 nodelay;

            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /r/ {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /health {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /openapi/ {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location /scalar/ {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  ConnectionStrings__Postgres: {{ printf "Host=postgres-service;Port=%v;Database=%s;Username=%s;Password=%s" .Values.postgres.service.port .Values.postgres.auth.database .Values.postgres.auth.username .Values.postgres.auth.password | quote }}
