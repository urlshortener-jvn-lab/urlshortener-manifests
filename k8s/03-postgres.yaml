# =====================================================================
# 03. POSTGRESQL — Database kèm Ổ cứng bền vững (PVC) & ClusterIP Service
# =====================================================================
# - PersistentVolumeClaim (PVC): Xin K8s cấp 1 ổ đĩa bền vững 256MB.
#   Tại sao phải có? Pod trong K8s có tính chất "phù du" (ephemeral) — nếu Pod chết
#   và được tạo mới mà không gắn PVC, toàn bộ bảng biểu và dữ liệu rút gọn link sẽ mất sạch!
# - Service (ClusterIP): Tạo tên DNS cố định "postgres-service:5432" chỉ cho phép
#   các Pod nội bộ trong cụm gọi vào, không mở cổng ra ngoài Internet.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: urlshortener
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: urlshortener
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate # Với DB dùng chung 1 ổ đĩa PVC, phải tắt Pod cũ rồi mới bật Pod mới để tránh xung đột khóa file
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: urlshortener-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: urlshortener-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urlshortener-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "urlshortener"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "urlshortener"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: urlshortener
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
