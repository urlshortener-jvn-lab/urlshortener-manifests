# =====================================================================
# 02. CONFIGMAP & SECRET — Tách biệt Cấu hình và Mật khẩu ra khỏi Image
# =====================================================================
# - ConfigMap: Lưu các biến môi trường KHÔNG nhạy cảm (host, port, tên DB, file config).
# - Secret: Lưu các thông tin NHẠY CẢM (mật khẩu DB, chuỗi kết nối có password, API key).
# - Nếu không có nó: Bạn phải nhét cứng cấu hình vào trong Docker Image. Mỗi lần đổi
#   IP Redis hay đổi cấu hình Nginx lại phải build lại Image từ đầu!

apiVersion: v1
kind: ConfigMap
metadata:
  name: urlshortener-config
  namespace: urlshortener
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  POSTGRES_DB: "urlshortener"
  POSTGRES_USER: "postgres"
  # Trỏ tới tên K8s Service của Redis (redis-service) kèm timeout 300ms chống treo request
  ConnectionStrings__Redis: "redis-service:6379,abortConnect=false,connectTimeout=300,syncTimeout=300,asyncTimeout=300"
  # Trỏ tới tên FQDN (tên miền đầy đủ) của K8s Service Backend: <service>.<namespace>.svc.cluster.local
  API_UPSTREAM_URL: "http://backend-service.urlshortener.svc.cluster.local:8080"
  # Cấu hình OpenTelemetry đẩy Logs, Traces, Metrics của cả 3 Pod Backend về Aspire Dashboard trong K8s
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard-service:18889"
  OTEL_SERVICE_NAME: "urlshortener-api"
---
# ConfigMap thứ 2: Chứa file cấu hình Nginx dành riêng cho môi trường Kubernetes
# Điểm khác biệt lớn nhất so với Docker Compose:
# - Docker Compose dùng DNS nội bộ là 127.0.0.11
# - Kubernetes dùng CoreDNS tại địa chỉ: kube-dns.kube-system.svc.cluster.local
# Nhờ ConfigMap, ta gắn (mount) đè file này vào Pod Frontend mà KHÔNG CẦN build lại Docker Image!
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: urlshortener
data:
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $request_method $limit_post_key {
        default "";
        POST    $binary_remote_addr;
    }

    limit_req_zone $limit_post_key zone=shorten_limit:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Sử dụng CoreDNS của Kubernetes thay vì 127.0.0.11 của Docker Compose
        resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            limit_req zone=shorten_limit burst=29 nodelay;

            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /r/ {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /health {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /openapi/ {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location /scalar/ {
            set $backend_upstream "${API_UPSTREAM_URL}";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secret
  namespace: urlshortener
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres_k8s_secret_password"
  # Kết nối tới K8s Service "postgres-service" ở cổng 5432
  ConnectionStrings__Postgres: "Host=postgres-service;Port=5432;Database=urlshortener;Username=postgres;Password=postgres_k8s_secret_password"
